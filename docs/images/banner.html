<!doctype html>
<!--
  Source of banner.png, the README banner. To re-render it (2x, with
  transparent rounded corners), from this directory:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
      --hide-scrollbars --default-background-color=00000000 \
      --force-device-scale-factor=2 --window-size=1280,400 \
      --screenshot=banner.png banner.html

  Colours follow www.gitbolt.com.
-->
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; }
  .b {
    position: relative; width: 1280px; height: 400px; box-sizing: border-box;
    border-radius: 18px; overflow: hidden;
    background:
      radial-gradient(700px 420px at 12% -10%, rgba(255,176,32,.20), transparent 62%),
      radial-gradient(640px 420px at 100% 110%, rgba(90,200,255,.13), transparent 60%),
      #0b0d10;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    color: #e6e9ef;
  }
  .grid {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,.07) 1px, transparent 1.2px);
    background-size: 22px 22px;
    -webkit-mask-image: linear-gradient(90deg, rgba(0,0,0,.9), rgba(0,0,0,.25) 70%);
  }
  .left { position: absolute; left: 72px; top: 0; bottom: 0; width: 640px;
          display: flex; flex-direction: column; justify-content: center; }
  .eyebrow { font: 600 15px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
             letter-spacing: .18em; color: #ffb020; margin-bottom: 22px; }
  .brand { display: flex; align-items: center; gap: 22px; }
  .brand img { width: 104px; height: 104px; filter: drop-shadow(0 10px 28px rgba(255,176,32,.28)); }
  .brand h1 { margin: 0; font-size: 88px; line-height: 1; font-weight: 800; letter-spacing: -.035em; }
  .tag { margin: 26px 0 0; font-size: 30px; line-height: 1.25; font-weight: 600;
         letter-spacing: -.01em; color: #e6e9ef; }
  .tag code { font: 600 29px ui-monospace, SFMono-Regular, Menlo, monospace; color: #ffcc4d; }
  .sub { margin-top: 14px; font-size: 18px; color: #9aa3b2; }
  .sub b { color: #c9d1dc; font-weight: 600; }
  .right { position: absolute; right: 0; top: 0; bottom: 0; width: 520px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
</style></head>
