name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  build:
    strategy:
      fail-fast: false  # Don't cancel other jobs if one platform fails
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      # v7 = node24. Its fork-PR guard only affects pull_request_target /
      # workflow_run, and it was already backported to the v4.4.0 we ran.
      - uses: actions/checkout@v7

      # qtsvg/qtdeclarative/qttools ship in the default Qt 6 desktop
      # install; the `modules:` input is only for ADDON modules
      # (qtcharts, qtwebengine, ...) and rejects base-archive names
      # like 'qtbase', so we don't pass it at all.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          # >= 6.9.2: older FindWrapOpenGL.cmake falls back to a hard-coded
          # `-framework AGL`, which current macOS SDKs no longer ship.
          # Not 6.11 yet: aqtinstall 3.3.0 can't read its Windows metadata.
          version: '6.10.*'
          cache: true    # Cache Qt between runs (~1.5 GB save)

      # Ninja is preinstalled on every GitHub-hosted image in the matrix
      # (ubuntu: /usr/local/bin, macOS: Homebrew, Windows: Chocolatey bin,
      # ahead of the VS-bundled copy). seanmiddleditch/gha-setup-ninja is
      # archived and still node20. The image's ninja moves with image
      # updates, and 1.13.0 once broke MSVC links on Windows images
      # (actions/runner-images#12531); if that recurs, pin a version by
      # downloading a ninja-build/ninja release zip onto $GITHUB_PATH.
      - name: Check Ninja
        shell: bash
        run: |
          command -v ninja || { echo "::error::ninja not found on PATH (runner image changed?)"; exit 1; }
          ninja --version

      # The Ninja generator finds no compiler unless the MSVC developer
      # environment (cl.exe, INCLUDE, LIB, ...) is in the job env. Plain
      # pwsh instead of ilammy/msvc-dev-cmd (unmaintained, still node20):
      # vswhere finds the newest VS with the x64 C++ tools, Microsoft's
      # Launch-VsDevShell.ps1 loads its dev env into this process, and
      # every variable it changed goes to GITHUB_ENV for later steps.
      # Reused by the package job through the &msvc_env anchor.
      - &msvc_env
        name: MSVC environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -nologo -latest -products '*' `
                  -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
                  -property installationPath
          if (-not $vs) { throw 'vswhere: no Visual Studio with the x64 C++ tools' }
          Write-Host "Visual Studio: $vs"

          $before = @{}
          Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }

          # -Arch/-HostArch default to x86; Qt (msvc2022_64) and vcpkg's
          # x64-windows libgit2 need the x64-hosted, x64-targeting tools.
          & (Join-Path $vs 'Common7\Tools\Launch-VsDevShell.ps1') `
              -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          $cl = (Get-Command cl.exe -CommandType Application -TotalCount 1 -ErrorAction SilentlyContinue).Source
          if ($cl -notmatch '\\Hostx64\\x64\\cl\.exe$') { throw "expected x64-hosted x64 cl.exe, got '$cl'" }
          Write-Host "cl.exe: $cl"

          # Export only what the dev shell added or changed. Path goes out
          # whole (env names are case-insensitive on Windows, so `Path=`
          # replaces the job's Path); the runner re-prepends earlier
          # GITHUB_PATH entries (Qt) on every later step. VCPKG_ROOT is
          # skipped: the dev shell points it at VS's bundled vcpkg, not
          # the image's C:\vcpkg that `vcpkg install` and the toolchain use.
          Get-ChildItem env: |
            Where-Object { $_.Name -ne 'VCPKG_ROOT' -and $before[$_.Name] -cne $_.Value } |
            ForEach-Object { "$($_.Name)=$($_.Value)" } |
            Add-Content -Path $env:GITHUB_ENV -Encoding utf8

      - name: Install libgit2 (macOS)
        if: runner.os == 'macOS'
        run: brew install libgit2 pkg-config

      # libgl1-mesa-dev: Qt6::Gui links OpenGL on Linux, and the aqt
      # Qt binaries expect the system GL headers/libs at link time.
      - name: Install libgit2 (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgit2-dev pkg-config libgl1-mesa-dev
      - name: Install libgit2 (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install libgit2:x64-windows pkgconf:x64-windows

      # ------------------------------------------------------------------
      # Configure, build, test. We use Ninja on every platform for
      # consistency and speed. On Windows we need the vcpkg toolchain
      # file so CMake can find libgit2.
      # ------------------------------------------------------------------
      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        # Quoted: PowerShell passes `$env:...` through literally in an
        # unquoted argument that starts with `-`.
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --parallel

      # offscreen: the widget-linked QTEST_MAIN binaries need a QPA
      # platform, and the Linux runners have no display server.
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

  # ==========================================================================
  # Release packaging — runs only on published releases (tag push)
  # ==========================================================================
  package:
    if: github.event_name == 'release'
    needs: build
    # The repo's default GITHUB_TOKEN is read-only, and action-gh-release
    # PATCHes the release and uploads assets, which needs contents: write.
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: GitBolt-macOS
          - os: ubuntu-24.04
            artifact: GitBolt-Linux
          - os: windows-latest
            artifact: GitBolt-Windows
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          # >= 6.9.2: older FindWrapOpenGL.cmake falls back to a hard-coded
          # `-framework AGL`, which current macOS SDKs no longer ship.
          # Not 6.11 yet: aqtinstall 3.3.0 can't read its Windows metadata.
          version: '6.10.*'
          cache: true

      # Preinstalled on all GitHub-hosted images; see the build job.
      - name: Check Ninja
        shell: bash
        run: |
          command -v ninja || { echo "::error::ninja not found on PATH (runner image changed?)"; exit 1; }
          ninja --version

      # Identical to the build job's MSVC step (YAML alias of &msvc_env),
      # so every PR run exercises what this release-only job will run.
      - *msvc_env

      - name: Install libgit2 (macOS)
        if: runner.os == 'macOS'
        run: brew install libgit2 pkg-config

      - name: Install libgit2 (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgit2-dev pkg-config libfuse2

      - name: Install libgit2 (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install libgit2:x64-windows pkgconf:x64-windows

      # ----------------------------------------------------------------------
      # Configure & Build
      # ----------------------------------------------------------------------
      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja -DCMAKE_INSTALL_PREFIX=/usr

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        # Quoted: PowerShell passes `$env:...` through literally in an
        # unquoted argument that starts with `-`.
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --parallel

      - name: Install
        run: cmake --install build --prefix build/install

      # ----------------------------------------------------------------------
      # macOS — DMG via CPack. The Qt runtime is bundled into the app
      # DURING cpack's staging install (qt_generate_deploy_app_script in
      # src/app/CMakeLists.txt), so the DMG payload is self-contained.
      # Running macdeployqt on a separate install tree afterwards — as
      # this workflow once did — never affected what cpack shipped.
      # ----------------------------------------------------------------------
      - name: Package DMG (macOS)
        if: runner.os == 'macOS'
        working-directory: build
        run: cpack -G DragNDrop -C Release

      # ----------------------------------------------------------------------
      # Windows — NSIS installer via CPack; Qt DLLs land in the payload
      # through the same install-time deploy script.
      # ----------------------------------------------------------------------
      - name: Package NSIS (Windows)
        if: runner.os == 'Windows'
        working-directory: build
        run: cpack -G NSIS -C Release

      # ----------------------------------------------------------------------
      # Linux — DEB via CPack + AppImage via linuxdeploy
      # ----------------------------------------------------------------------
      - name: Package DEB (Linux)
        if: runner.os == 'Linux'
        working-directory: build
        run: cpack -G DEB -C Release

      - name: Build AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          # Download linuxdeploy and Qt plugin
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

          # Set up AppDir structure
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps AppDir/usr/share/metainfo
          cp build/install/bin/GitBolt AppDir/usr/bin/ || cp build/GitBolt AppDir/usr/bin/
          cp src/app/platform/linux/gitbolt.desktop AppDir/usr/share/applications/
          cp src/app/platform/linux/gitbolt.appdata.xml AppDir/usr/share/metainfo/
          # Use icon if available, otherwise create placeholder.
          # The hicolor spec expects the file named after the Icon=
          # key in the .desktop file (gitbolt.png), so we rename the
          # canonical 256-size PNG at copy time.
          if [ -f resources/icons/gitbolt-256.png ]; then
            cp resources/icons/gitbolt-256.png AppDir/usr/share/icons/hicolor/256x256/apps/gitbolt.png
          else
            convert -size 256x256 xc:steelblue AppDir/usr/share/icons/hicolor/256x256/apps/gitbolt.png 2>/dev/null || true
          fi

          export QMAKE=$(find $Qt6_DIR -name qmake -type f 2>/dev/null | head -1 || echo "qmake")
          # No `|| true`: if AppImage assembly breaks we want the job
          # red, not a silently missing artifact.
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage

      # ----------------------------------------------------------------------
      # Upload build artifacts
      # ----------------------------------------------------------------------
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp build/GitBolt-*.dmg dist/ 2>/dev/null || true
          cp build/GitBolt-*.exe dist/ 2>/dev/null || true
          cp build/GitBolt-*.deb dist/ 2>/dev/null || true
          cp build/GitBolt-*.tar.gz dist/ 2>/dev/null || true
          cp GitBolt-*.AppImage dist/ 2>/dev/null || true
          ls -la dist/

      # v7 = node24 (v5 was still node20). `archive` defaults to true, which
      # dist/* needs: it can hold several files (.deb + .AppImage).
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: warn

      # ----------------------------------------------------------------------
      # Attach installers to the GitHub Release
      # ----------------------------------------------------------------------
      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        # v3 = node24; v2 is frozen at v2.6.2 on node20. Same inputs and
        # outputs (action.yml differs only in runs.using); 3.0.x adds upload
        # and error-handling fixes. No token wiring: the `token` input
        # defaults to github.token (the old env GITHUB_TOKEN is deprecated).
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
