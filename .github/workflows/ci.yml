name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          modules: 'qtbase'

      - name: Install libgit2 (macOS)
        if: runner.os == 'macOS'
        run: brew install libgit2 pkg-config

      - name: Install libgit2 (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libgit2-dev pkg-config

      - name: Install libgit2 (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install libgit2

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release
